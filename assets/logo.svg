<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230" role="img" aria-label="Yetkaz.uz logo">
  <title>Yetkaz.uz</title>
  <desc>G'ildirakdagi burger — burger va yetkazib beruvchi mototsikl uyg'unlashtirilgan logo</desc>

  <!-- ===== EMBLEM (badge) ===== -->
  <circle cx="125" cy="115" r="92" fill="#C8102E"/>
  <circle cx="125" cy="115" r="92" fill="none" stroke="#8C0A1F" stroke-width="6"/>
  <circle cx="125" cy="115" r="79" fill="none" stroke="#E8A33D" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/>

  <!-- speed swooshes -->
  <path d="M24 96 H70" stroke="#F6C66B" stroke-width="6" stroke-linecap="round"/>
  <path d="M16 118 H64" stroke="#F6C66B" stroke-width="6" stroke-linecap="round" opacity=".8"/>
  <path d="M24 140 H70" stroke="#F6C66B" stroke-width="6" stroke-linecap="round" opacity=".62"/>

  <!-- handlebar -->
  <path d="M183 150 L196 101" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round"/>
  <path d="M184 99 L210 92" stroke="#1A1A1A" stroke-width="7" stroke-linecap="round"/>
  <circle cx="211" cy="90" r="4.5" fill="#E8A33D"/>

  <!-- wheels -->
  <circle cx="86" cy="172" r="21" fill="#1A1A1A"/>
  <circle cx="86" cy="172" r="8.5" fill="#FFFBF7"/>
  <circle cx="86" cy="172" r="4" fill="#E8A33D"/>
  <circle cx="170" cy="172" r="21" fill="#1A1A1A"/>
  <circle cx="170" cy="172" r="8.5" fill="#FFFBF7"/>
  <circle cx="170" cy="172" r="4" fill="#E8A33D"/>
  <!-- chassis link -->
  <path d="M86 172 L170 172" stroke="#1A1A1A" stroke-width="5" stroke-linecap="round"/>

  <!-- ===== BURGER as the body ===== -->
  <!-- bottom bun -->
  <path d="M64 150 h120 a3 3 0 0 1 3 3 v1 a9 9 0 0 1 -9 9 h-108 a9 9 0 0 1 -9 -9 v-1 a3 3 0 0 1 3 -3 z" fill="#E8A33D"/>
  <path d="M61 154 h124" stroke="#D08A22" stroke-width="2" stroke-linecap="round" opacity=".6"/>
  <!-- patty -->
  <rect x="66" y="140" width="116" height="12" rx="6" fill="#6B3A1E"/>
  <!-- cheese drips -->
  <path d="M70 140 l13 11 l13 -11 l13 11 l13 -11 l13 11 l13 -11 l12 0 l0 6 l-103 0 z" fill="#F6C66B"/>
  <!-- lettuce -->
  <path d="M65 135 q10 8 20 0 q10 8 20 0 q10 8 20 0 q10 8 20 0 q10 8 19 0 l0 5 l-119 0 z" fill="#2E9E5B"/>
  <!-- top bun -->
  <path d="M65 136 a60 44 0 0 1 119 0 z" fill="#E8A33D"/>
  <path d="M65 136 a60 44 0 0 1 119 0" fill="none" stroke="#D08A22" stroke-width="2"/>
  <!-- sesame -->
  <ellipse cx="96" cy="118" rx="3.2" ry="1.7" fill="#FFFBF7" transform="rotate(-22 96 118)"/>
  <ellipse cx="116" cy="110" rx="3.2" ry="1.7" fill="#FFFBF7" transform="rotate(12 116 110)"/>
  <ellipse cx="136" cy="112" rx="3.2" ry="1.7" fill="#FFFBF7" transform="rotate(-10 136 112)"/>
  <ellipse cx="124" cy="122" rx="3.2" ry="1.7" fill="#FFFBF7"/>
  <ellipse cx="150" cy="120" rx="3.2" ry="1.7" fill="#FFFBF7" transform="rotate(18 150 120)"/>

  <!-- ===== WORDMARK ===== -->
  <text x="250" y="126" font-family="Manrope, 'Arial Black', Arial, sans-serif" font-size="74" font-weight="800" letter-spacing="-2" fill="#1A1A1A">Yetkaz<tspan fill="#C8102E">.uz</tspan></text>
  <text x="254" y="163" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="2.5" fill="#8C0A1F">Mazza · Tezlik · Yetkaz</text>
</svg>
